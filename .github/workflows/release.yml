name: Release extension

on:
  push:
    branches: [main]
    # Only extension changes create a release. Landing page, docs, tests and CI edits don't.
    # (Keep in sync with the excludes in "Build zip"; run manually via workflow_dispatch if needed.)
    paths-ignore:
      - 'website/**'
      - 'docs/**'
      - 'test/**'
      - '.github/**'
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test matcher
        run: node test/run.mjs > /dev/null

      - name: Compute version
        id: v
        run: |
          base=$(node -p "require('./manifest.json').version.split('.').slice(0,2).join('.')")
          echo "version=${base}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build zip
        run: |
          VERSION=${{ steps.v.outputs.version }}
          mkdir -p dist/ext
          # Ship everything except non-extension folders, so new extension folders are never forgotten.
          tar --exclude='./.*' --exclude='./website' --exclude='./docs' --exclude='./test' --exclude='./dist' --exclude='node_modules' -cf - . | tar -xf - -C dist/ext
          # Every file the manifest references must be in the package.
          node -e "
            const fs = require('fs'), m = require('./dist/ext/manifest.json');
            const files = [m.background?.service_worker, m.side_panel?.default_path, ...(m.content_scripts || []).flatMap(c => c.js || []),
              ...Object.values(m.icons || {}), ...Object.values(m.action?.default_icon || {}), ...(m.web_accessible_resources || []).flatMap(w => w.resources)].filter(Boolean);
            const missing = files.filter(f => !fs.existsSync('dist/ext/' + f));
            if (missing.length) { console.error('Missing from package:', missing); process.exit(1); }
            console.log('Package OK:', files.length, 'referenced files present');"
          node -e "
            const fs=require('fs'), p='dist/ext/manifest.json';
            const m=JSON.parse(fs.readFileSync(p)); m.version='$VERSION';
            fs.writeFileSync(p, JSON.stringify(m, null, 2) + '\n');"
          cd dist/ext && zip -qr ../shortlist-extension.zip . && cd ..
          cp shortlist-extension.zip "shortlist-extension-v${VERSION}.zip"
          ls -la

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${{ steps.v.outputs.version }}
          gh release create "v${VERSION}" \
            dist/shortlist-extension.zip "dist/shortlist-extension-v${VERSION}.zip" \
            --target "$GITHUB_SHA" \
            --title "Shortlist v${VERSION}" \
            --generate-notes \
            --latest
